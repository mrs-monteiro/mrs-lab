
name: Atualizar agenda MRS Predictive Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-agenda-preditivo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar agenda
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/atualizar_agenda.py

      - name: Publicar agenda atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preditivo/data/agenda.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar agenda desportiva via API-Sports"
            git push
          fi
